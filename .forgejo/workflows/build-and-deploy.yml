name: Build and Deploy Website

on:
  push:
    branches:
      - master
    paths:
      - "**.go"
      - "go.mod"
      - "site/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".forgejo/workflows/build-and-deploy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: nuc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.smpark.in
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: git.smpark.in/smparkin/website:latest
          cache-from: type=registry,ref=git.smpark.in/smparkin/website:buildcache
          cache-to: type=registry,ref=git.smpark.in/smparkin/website:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # The compose file lives in the homelab repo (nuc/website/); this rolls the
      # container onto the new image, as Barkinson's deploy does (Watchtower used to).
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/homelab
            docker compose -f nuc/website/docker-compose.yml up -d --pull always
